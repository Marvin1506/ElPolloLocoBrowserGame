<!DOCTYPE html>
<html lang="en">
<html translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pollo Loco</title>

<body onload="init()">
    
<h1>El Pollo Loco</h1>

    <div id="game-content-fullscreen" class="game-content">
        <canvas id="canvas" width="720" height="480">

        </canvas>

        <div class="mobile-button-flexbox" id="mobile-button-flexbox">
            <div class="mobile-button-div-move-left-right">
                <button id="left" class="control-panel">
                    ◀
                </button>
                <button id="right" class="control-panel">
                    ▶
                </button>
            </div>

            <div class="mobile-button-div-jump-throw">
                <button id="jump" class="control-panel">
                    ⮝
                </button>
                <button id="throw" class="control-panel">
                    <img class="throw-bottle-icon-mobile" src="img/6_salsa_bottle/salsa_bottle.png" alt="" srcset="">
                </button>
            </div>
        </div>
    </div>
</body>
